<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Particles</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
body{margin:0;background:black;overflow:hidden}
#canvas{position:fixed;inset:0;width:100%;height:100%}
#cam{position:fixed;top:10px;left:10px;width:120px;border-radius:12px;border:2px solid white;z-index:10}
#label{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:white;font-size:22px;font-weight:900;font-family:sans-serif;z-index:10}
</style>
</head>
<body>
<video id="cam" playsinline></video>
<canvas id="canvas"></canvas>
<div id="label">افتح كفك ✋</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const label = document.getElementById('label');
canvas.width = innerWidth; canvas.height = innerHeight;
let N = 1200;
let particles = [];
let targets = [];
let shape = 'scatter';

function randomTarget(){
  let pts=[];
  for(let i=0;i<N;i++){
    if(shape==='heart'){
      let t=Math.random()*Math.PI*2;
      let x=16*Math.pow(Math.sin(t),3);
      let y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      pts.push({x: canvas.width/2 + x*16, y: canvas.height/2 - y*16});
    } else if(shape==='circle'){
      let a=Math.random()*Math.PI*2, r=Math.random()*160;
      pts.push({x: canvas.width/2 + Math.cos(a)*r, y: canvas.height/2 + Math.sin(a)*r});
    } else if(shape==='text'){
      pts.push({x: Math.random()*canvas.width*0.6 + canvas.width*0.2, y: Math.random()*120 + canvas.height/2 - 60});
    } else {
      pts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height});
    }
  }
  return pts;
}
for(let i=0;i<N;i++) particles.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight});
targets = randomTarget();

function setShape(s){
  if(s===shape) return;
  shape=s; targets=randomTarget();
  label.textContent = s==='scatter' ? 'افتح كفك ✋ - منتشر' : s==='circle' ? 'صوباع واحد ☝️ - كوكب' : s==='text' ? 'صوباعين ✌️ - I LOVE YOU' : '3 صوابع - قلب ❤️';
}

function draw(){
  ctx.fillStyle='black'; ctx.fillRect(0,0,canvas.width,canvas.height);
  let col = shape==='heart' ? '#ff2d55' : shape==='text' ? '#00e5ff' : shape==='circle' ? '#ffcc00' : '#ffffff';
  for(let i=0;i<N;i++){
    let p=particles[i], t=targets[i];
    p.x += (t.x-p.x)*0.08 + (Math.random()-0.5)*1.5;
    p.y += (t.y-p.y)*0.08 + (Math.random()-0.5)*1.5;
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill();
  }
  if(shape==='text'){
    ctx.fillStyle='white'; ctx.font='900 42px sans-serif'; ctx.textAlign='center';
    ctx.fillText('I LOVE YOU', canvas.width/2, canvas.height/2+12);
  }
  requestAnimationFrame(draw);
}
draw();

const hands = new Hands({locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.6});
hands.onResults(res=>{
  if(!res.multiHandLandmarks || res.multiHandLandmarks.length===0) return;
  let lm = res.multiHandLandmarks[0];
  let fingers=0;
  if(lm[8].y < lm[6].y) fingers++;
  if(lm[12].y < lm[10].y) fingers++;
  if(lm[16].y < lm[14].y) fingers++;
  if(lm[20].y < lm[18].y) fingers++;
  if(lm[4].x > lm[3].x) fingers++;
  // لو الايد شمال، اعكس
  if(fingers===5) setShape('scatter');
  else if(fingers===1) setShape('circle');
  else if(fingers===2) setShape('text');
  else if(fingers===3) setShape('heart');
});
const cam = new Camera(document.getElementById('cam'), {
  onFrame: async()=>{ await hands.send({image: document.getElementById('cam')}); },
  width:640, height:480
});
cam.start();
</script>
</body>
</html>
